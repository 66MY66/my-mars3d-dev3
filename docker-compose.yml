version: '3.8'

services:
  gateway:
    image: nginx:1.27.5-alpine
    container_name: mars3d-gateway
    ports:
      - "8888:8888"
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mars3d-frontend:
        condition: service_healthy
      jeecg-backend:
        condition: service_healthy
    networks:
      - mars3d-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/mars3d/"]
      interval: 30s
      timeout: 10s
      retries: 3

  mars3d-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mars3d-frontend
    ports:
      - "5280:3000"  # 外部5280端口映射到内部3000端口
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./config:/app/dist/config
      - ./config:/app/config
      - ./config/index.html:/app/dist/index.html
      - ./config/gx.jpg:/app/dist/favicon.ico
    networks:
      - mars3d-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:5.7.44
    container_name: mars3d-jeecg-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci", "--lower_case_table_names=1"]
    environment:
      MYSQL_DATABASE: jeecg-boot
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: jeecg
      MYSQL_PASSWORD: ${JEECG_DB_PASSWORD:?Set JEECG_DB_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - mars3d-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  redis:
    image: redis:6.2.14-alpine
    container_name: mars3d-jeecg-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    networks:
      - mars3d-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  jeecg-backend:
    build:
      context: ./deploy/jeecg
      dockerfile: Dockerfile
    container_name: mars3d-jeecg-backend
    restart: unless-stopped
    environment:
      JEECG_DB_HOST: mysql
      JEECG_DB_NAME: jeecg-boot
      JEECG_DB_USER: jeecg
      JEECG_DB_PASSWORD: ${JEECG_DB_PASSWORD:?Set JEECG_DB_PASSWORD in .env}
      JEECG_REDIS_HOST: redis
      JEECG_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - jeecg-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mars3d-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/9100'"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  mars3d-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  jeecg-data:
