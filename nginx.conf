server {
    listen 8888;
    server_name localhost;

    # 入口重定向：避免访问 / 或 /mars3d 看到目录列表
    location = / {
        return 301 $scheme://$http_host/mars3d/;
    }

    location = /mars3d {
        return 301 $scheme://$http_host/mars3d/;
    }

    # 前端静态文件（部署在 /mars3d/ 子路径）
    # mars3d-frontend 实际 serve 的根目录是 dist/mars3d，因此这里需要去掉 /mars3d 前缀再转发
    location ^~ /mars3d/ {
        rewrite ^/mars3d/(.*)$ /$1 break;
        proxy_pass http://mars3d-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 86400;
    }

    location / {
        return 301 $scheme://$http_host/mars3d/;
    }

    # eoAPI 数据集/成果包(manifest) API 代理
    location = /api/eoapi/datasets {
        proxy_pass http://192.168.10.15:5960/datasets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/eoapi/datasets/ {
        proxy_pass http://192.168.10.15:5960/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # eoAPI STAC 代理 - 解决跨域问题
    # eoAPI 导入会话管理 API 代理
    location /api/eoapi/imports/ {
        proxy_pass http://192.168.10.15:5960/imports/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /api/eoapi/ {
        proxy_pass http://192.168.10.15:5951/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # TiTiler 代理 - 用于渲染 COG 影像（PgSTAC）
    location /api/titiler/ {
        proxy_pass http://192.168.10.15:5952/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # TiTiler-COG 代理 - 用于直接渲染外部公开 COG 文件（如 Maxar OpenData）
    location /api/titiler-cog/ {
        proxy_pass http://192.168.10.15:5955/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # 发布审核流（同域 /api）
    location /api/datasets/ {
        proxy_pass http://192.168.10.15:5960;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers '*' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
